<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiftLink - Give & Recycle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
    .container { padding: 40px; max-width: 700px; }
    h1 { font-size: 64px; margin-bottom: 20px; }
    .tagline { font-size: 22px; margin-bottom: 40px; opacity: 0.95; }
    .get-started {
      background: #27ae60;
      color: white;
      border: none;
      padding: 18px 50px;
      font-size: 20px;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .get-started:hover { transform: scale(1.05); }
    .features { margin-top: 50px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .feature { background: rgba(255,255,255,0.15); padding: 15px 25px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎁 GiftLink</h1>
    <p class="tagline">Give away what you don't need. Find what you do — for free.</p>
    <button class="get-started" onclick="alert('Welcome to GiftLink!')">Get Started</button>
    <div class="features">
      <div class="feature">♻️ Recycle</div>
      <div class="feature">🤝 Share</div>
      <div class="feature">🆓 Free Items</div>
    </div>
  </div>
</body>
</html>
